name: Automated Daily Tutorials & Blogs Cloud Sync

on:
  schedule:
    # Runs every day at 00:00 UTC (05:30 AM Sri Lanka Time)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-cloud-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@f43a0e5ff2bd294195055a0e4cc2210e1a2ad8c6 # v3.5.3 (SHA-pinned)

      - name: Set up Python 3.12
        uses: actions/setup-python@61a6322f88396a6271a6ee3565807d608ecaddd1 # v4.7.0 (SHA-pinned)
        with:
          python-python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run Coding Tutorials Auto-Sync Bot
        run: |
          python scripts/sync_tutorials.py || true

      - name: Run Tech Blogs Auto-Sync Bot
        run: |
          python scripts/sync_tech_blogs.py || true

      - name: Run AI SEO Curriculum Architect Bot
        run: |
          python sync_ai_curriculum_seo_bot.py || true

      - name: Commit and Push Updates to GitHub Pages
        run: |
          git config --global user.name "Infinite Cloud Bot"
          git config --global user.email "bot@infiniteweb.dev"
          git add data/ || true
          git commit -m "Automated 24/7 Daily Cloud Sync (Tutorials, Blogs & SEO Modules)" || true
          git push origin main || true
