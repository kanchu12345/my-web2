name: Automated Daily Tutorials & Blogs Cloud Sync

on:
  schedule:
    # Runs every day at 00:00 UTC (05:30 AM Sri Lanka Time)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  daily-cloud-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run W3Schools Tutorials Auto-Sync Bot
        run: |
          python scratch/sync_w3schools_tutorials.py || true

      - name: Run Sinhala Tech Blogs Auto-Sync Bot
        run: |
          python scratch/sync_all_sinhala_tech_sources.py || true

      - name: Commit and Push Updates to GitHub Pages
        run: |
          git config --global user.name "Infinite Cloud Bot"
          git config --global user.email "bot@infiniteweb.dev"
          git add data/w3-tutorials.js data/blogs.json || true
          git commit -m "Automated 24/7 Daily Cloud Sync (W3Schools & Sinhala Tech News)" || true
          git push origin main || true
