    <path d="M7 19L15 7L23 19H7Z" fill="#070c18"/>
    <text x="38" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="1.2">DANAN <tspan fill="#f59e0b">RENTALS</tspan></text>
    <text x="38" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="1.5">CAR &amp; BIKE HIRE • KANDY</text>
  </g>

  <!-- Nav Items -->
  <g transform="translate(430, 34)" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
    <text x="0" y="0">Cars</text>
    <text x="50" y="0">Bikes</text>
    <text x="100" y="0">Vans</text>
    <text x="150" y="0">Permits</text>
  </g>

  <!-- WhatsApp Action Pill -->
  <g transform="translate(640, 16)">
    <rect width="124" height="28" rx="14" fill="url(#emeraldGrad)"/>
    <text x="62" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Book on WhatsApp</text>
  </g>

  <!-- Hero Content Section -->
