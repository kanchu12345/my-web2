      <circle cx="13" cy="24" r="5" stroke="#10b981" stroke-width="2" fill="none"/>
      <circle cx="23" cy="24" r="5" stroke="#10b981" stroke-width="2" fill="none"/>
      <path d="M13 24L18 16H23M18 16L21 24" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
