    <!-- Spec List -->
    <text x="16" y="84" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• Honda Dio, Ray ZR, Scooters</text>
