    </text>
    <text x="0" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
      200 Free Km/Day • Fully Insured • AA Ceylon Driving Permits • 24/7 Roadside Support
    </text>
  </g>

  <!-- 3 Interactive Fleet Category Cards -->
