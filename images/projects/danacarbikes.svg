    <!-- Price Pill -->
    <rect x="16" y="142" width="192" height="30" rx="8" fill="rgba(4,170,109,0.12)" stroke="rgba(4,170,109,0.3)" stroke-width="1"/>
    <text x="26" y="161" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">Rates from Rs. 3,000/day</text>
    <text x="194" y="161" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="end">Book →</text>
  </g>

