  <g transform="translate(540, 222)">
    <rect width="224" height="186" rx="14" fill="url(#cardGradDanan)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="0" y="0" width="224" height="4" rx="2" fill="#38bdf8"/>
    
    <!-- Van Icon -->
    <g transform="translate(16, 22)">
      <rect width="36" height="36" rx="10" fill="rgba(56,189,248,0.18)"/>
      <path d="M9 25V17C9 15.5 10 14 12 14H22C24 14 26 15.5 27 18L28 25M9 25H28M12 25V27M25 25V27M13 18H18" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <text x="62" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Vans &amp; Transfers</text>
    <text x="62" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Airport &amp; Family Tours</text>

    <!-- Spec List -->
    <text x="16" y="84" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• KDH Super GL &amp; Commuter</text>
    <text x="16" y="104" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• AA Ceylon Tourist Permits</text>
    <text x="16" y="124" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• Experienced Chauffeur</text>

    <!-- Price Pill -->
    <rect x="16" y="142" width="192" height="30" rx="8" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <text x="26" y="161" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">Custom Day Itineraries</text>
    <text x="194" y="161" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="end">Inquire →</text>
  </g>

  <!-- Bottom Trust Bar -->
  <g transform="translate(36, 436)">
    <rect width="728" height="44" rx="10" fill="rgba(15,23,42,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <g transform="translate(24, 26)" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">
      <text x="0" y="0"><tspan fill="#04aa6d">✓</tspan> Kandy &amp; Peradeniya Hub</text>
      <text x="175" y="0"><tspan fill="#f59e0b">✓</tspan> 24/7 Roadside Assistance</text>
      <text x="375" y="0"><tspan fill="#38bdf8">✓</tspan> WhatsApp Instant Confirmation</text>
      <text x="580" y="0"><tspan fill="#04aa6d">✓</tspan> danacarbikes.com</text>
    </g>
  </g>
</svg>
