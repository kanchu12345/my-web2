<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgTropica" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#141f38"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#04aa6d"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgTropica)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Glowing background accents -->
  <circle cx="700" cy="120" r="180" fill="#04aa6d" opacity="0.12" filter="url(#glow)"/>
  <circle cx="100" cy="400" r="150" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>

  <!-- Top Mock Navigation Bar -->
  <rect x="0" y="0" width="800" height="58" fill="rgba(10,16,29,0.85)"/>
  <line x1="0" y1="58" x2="800" y2="58" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Logo Brand -->
  <g transform="translate(36, 16)">
    <!-- Leaf / Spice Icon -->
    <path d="M12 2C6 2 2 8 2 14c0 6 5 10 11 10 7 0 11-5 11-12 0-7-6-12-12-12zm0 20c-4.4 0-8-3.6-8-8 0-4.8 3.5-8.5 8-9.6 0 3.6 1.4 7.2 4 9.8-1.2 4.6-5 7.8-4 7.8z" fill="url(#greenGrad)"/>
    <text x="32" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="1.5">TROPICA FLAVOURS</text>
    <text x="32" y="29" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2">CEYLON ORGANIC EXPORTS</text>
  </g>

  <!-- Nav Links -->
  <g transform="translate(420, 32)" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
    <text x="0" y="0">Spices</text>
    <text x="65" y="0">Vanilla Beans</text>
    <text x="165" y="0">Wholesale</text>
    <rect x="250" y="-16" width="100" height="30" rx="6" fill="#04aa6d"/>
    <text x="270" y="3" fill="#ffffff" font-weight="800" font-size="11">EXPORT B2B</text>
  </g>

  <!-- Hero Content Area -->
  <!-- Eyebrow Badge -->
  <g transform="translate(36, 92)">
    <rect width="250" height="26" rx="13" fill="rgba(4,170,109,0.15)" stroke="rgba(4,170,109,0.4)" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#04aa6d"/>
    <text x="26" y="17" fill="#04aa6d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1">100% CERTIFIED PURE CEYLON</text>
  </g>

  <!-- Hero Title -->
  <text x="36" y="160" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
    Premium Ceylon Spices &amp;
  </text>
  <text x="36" y="202" fill="url(#goldGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
    Organic Vanilla Wholesale
  </text>

  <!-- Subtitle -->
  <text x="36" y="235" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">
    Direct from Sri Lankan certified regenerative plantations to international buyers in Europe, USA &amp; Asia.
  </text>

  <!-- Feature Cards Grid (3 cards) -->
  <!-- Card 1: Alba Cinnamon -->
  <g transform="translate(36, 265)">
    <rect width="225" height="150" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="rgba(245,158,11,0.2)"/>
    <text x="26" y="40" fill="#f59e0b" font-family="sans-serif" font-size="18">🍂</text>
    <text x="16" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Alba Ceylon Cinnamon</text>
    <text x="16" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Zero coumarin, slim quills,</text>
    <text x="16" y="114" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">highest essential oil purity.</text>
    <text x="16" y="136" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">✓ Export Grade A1</text>
  </g>

  <!-- Card 2: Bourbon Vanilla -->
  <g transform="translate(285, 265)">
    <rect width="225" height="150" rx="14" fill="url(#cardGrad)" stroke="rgba(4,170,109,0.35)" stroke-width="1.5"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="rgba(4,170,109,0.2)"/>
    <text x="26" y="40" fill="#10b981" font-family="sans-serif" font-size="18">🌱</text>
    <text x="16" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Organic Bourbon Vanilla</text>
    <text x="16" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Grown at high elevation,</text>
    <text x="16" y="114" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">vanillin profile &gt; 2.2%.</text>
    <text x="16" y="136" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">★ Gourmet Grade Beans</text>
  </g>

  <!-- Card 3: Global Logistics -->
  <g transform="translate(534, 265)">
    <rect width="230" height="150" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="rgba(56,189,248,0.2)"/>
    <text x="26" y="40" fill="#38bdf8" font-family="sans-serif" font-size="18">🚢</text>
    <text x="16" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Worldwide Shipping</text>
    <text x="16" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">FCL &amp; LCL container sea freight,</text>
    <text x="16" y="114" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">express air courier worldwide.</text>
    <text x="16" y="136" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">✓ Port of Colombo (CMB)</text>
  </g>

  <!-- Bottom Verification Footer Bar -->
  <rect x="0" y="450" width="800" height="50" fill="rgba(10,16,29,0.9)"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <g transform="translate(36, 480)" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">
    <text x="0" y="0">ISO 22000 Certified</text>
    <text x="140" y="0">•</text>
    <text x="160" y="0">GMP Standards</text>
    <text x="270" y="0">•</text>
    <text x="290" y="0">USDA &amp; EU Organic</text>
    <text x="430" y="0">•</text>
    <text x="450" y="0">Sri Lanka Export Development Board Registered</text>
  </g>
</svg>