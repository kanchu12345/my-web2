<style>
  .badge-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: rgba(0,170,255,0.12);
    color: var(--blue);
  }
  .badge-tag.featured {
    background: #04AA6D;
    color: #fff;
  }
  .pkg-item-price {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: #04AA6D;
    margin-top: 4px;
  }
  .pkg-item-features {
    font-size: 11px;
    color: var(--grey);
    margin-top: 6px;
    line-height: 1.4;
  }
  .reset-defaults-btn {
    background: rgba(255,255,255,0.05);
    color: var(--grey-l);
    border: 1px dashed var(--glass-b);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
  }
  .reset-defaults-btn:hover {
    background: rgba(255,170,0,0.1);
    color: #ffaa00;
    border-color: #ffaa00;
  }
  .form-checkbox-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    padding: 10px 14px;
    background: var(--card2);
    border: 1px solid var(--glass-b);
    border-radius: 10px;
  }
  .form-checkbox-wrap input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #04AA6D;
    cursor: pointer;
  }
</style>

<main class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <h1 class="page-title">Packages & Pricing Manager</h1>
      <div class="page-sub">Add, edit pricing, update features, and manage website packages</div>
    </div>
    <div class="topbar-right">
      <a href="../index.html#packages" target="_blank" class="btn-form" style="background:var(--blue-dim);color:var(--blue);border:1px solid var(--blue-b);padding:8px 16px;text-decoration:none;font-size:12px;display:inline-flex;align-items:center;gap:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        View on Website
      </a>
    </div>
  </header>

  <div class="proj-manager">
    <!-- List of packages -->
    <div class="proj-list-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div class="form-title" style="margin:0;">All Packages <span id="pkgCount" style="font-size:12px;color:var(--grey);font-weight:400"></span></div>
      </div>
      <div id="pkgList"><div class="no-projects">Loading packages…</div></div>
      <button type="button" class="reset-defaults-btn" id="resetDefaultsBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 2v6h6M21.5 22v-6h-6"/><path d="M22 11.5A10 10 0 0 0 3.2 7.2L2.5 8M2 12.5a10 10 0 0 0 18.8 4.3l.7.7"/></svg>
        Reset to Default 6 Packages
      </button>
    </div>

    <!-- Add / Edit Form -->
    <div class="proj-form-card">
      <div class="form-title" id="formTitle">Add New Package</div>
      <input type="hidden" id="editId">
      <form id="pkgForm" novalidate>
        <div class="form-field">
          <label class="form-label" for="pName">Package Name *</label>
          <input type="text" id="pName" class="form-input" placeholder="e.g. Starter, Standard, Professional" maxlength="80" required>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="form-field">
            <label class="form-label" for="pPrice">Price Display *</label>
            <input type="text" id="pPrice" class="form-input" placeholder="e.g. Rs. 5,000/-" maxlength="50" required>
          </div>
          <div class="form-field">
            <label class="form-label" for="pTag">Badge / Tag</label>
            <input type="text" id="pTag" class="form-input" placeholder="e.g. Essential, Most Popular" maxlength="30">
          </div>
        </div>
        <div class="form-field">
          <label class="form-label" for="pDesc">Short Description</label>
          <input type="text" id="pDesc" class="form-input" placeholder="Brief summary of target client or package value" maxlength="200">
        </div>
        <div class="form-field">
          <label class="form-label" for="pFeatures">Features (One per line) *</label>
          <textarea id="pFeatures" class="form-textarea form-input" rows="6" placeholder="3 Pages Included&#10;Mobile Friendly Design&#10;WhatsApp & Social Media Integration" required></textarea>
        </div>
        <div class="form-field">
          <label class="form-label" for="pAddon">Extra Pages / Add-on Note</label>
          <input type="text" id="pAddon" class="form-input" placeholder="e.g. 📄 Need more pages? Add extra pages for just Rs. 1,500/- per page!" maxlength="200">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="form-field">
            <label class="form-label" for="pCta">Button Text</label>
            <input type="text" id="pCta" class="form-input" placeholder="e.g. Choose Starter" maxlength="40">
          </div>
          <div class="form-field">
            <label class="form-label" for="pOrder">Sort Order</label>
            <input type="number" id="pOrder" class="form-input" placeholder="1, 2, 3..." min="1" max="99" value="1">
          </div>
        </div>
        <div class="form-field">
          <div class="form-checkbox-wrap">
            <input type="checkbox" id="pFeatured">
            <label for="pFeatured" style="font-size:13px;font-weight:600;color:var(--white);cursor:pointer;">
              Highlight as "Most Popular / Featured" Package
            </label>
          </div>
        </div>
        <div style="display:flex;gap:10px;margin-top:16px;">
          <button type="submit" class="btn-form" id="submitBtn">Add Package</button>
          <button type="button" class="btn-form" id="cancelEdit" style="display:none;background:var(--glass);color:var(--white);border:1px solid var(--glass-b)">Cancel</button>
        </div>
      </form>
    </div>
  </div>
