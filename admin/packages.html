    features: [
      "Complete E-Commerce Online Store",

let currentPackages = [];

/* ── Auth guard with Master Admin Support ── */
function initPackagesAuth() {
  const isMaster = sessionStorage.getItem('infinite_admin_auth') === 'true';
  const storedUser = JSON.parse(localStorage.getItem('infinite_admin_user') || '{"email":"infinitedesign768@gmail.com"}');
  
  const emEl = document.getElementById('sbEmail');
  const avEl = document.getElementById('sbAvatar');
  if (emEl) emEl.textContent = storedUser.email || 'infinitedesign768@gmail.com';
  if (avEl) avEl.textContent = (storedUser.email || 'A')[0].toUpperCase();

  loadPackages();

  onAuthStateChanged(auth, u => {
    if (u) {
      if (emEl) emEl.textContent = u.email;
      if (avEl) avEl.textContent = u.email[0].toUpperCase();
    } else if (!isMaster) {
      window.location.href = 'login.html';
    }
  });
}

initPackagesAuth();
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sessionStorage.removeItem("infinite_admin_auth"); signOut(auth);window.location.href='login.html';
});

/* ── Toast ── */
function toast(msg, type='ok'){
  const t=document.getElementById('toast'), m=document.getElementById('toastMsg');
  t.className='toast show toast-'+type; m.textContent=msg;
  setTimeout(()=>t.classList.remove('show'),3200);
}

function sanitise(str){
  return String(str || '').replace(/[<>&"']/g,'').trim();
}

/* ── Load Packages ── */
/* ── Load packages with robust JSON fallback ── */
async function loadPackages(){
  const list=document.getElementById('pkgList');
  const cnt=document.getElementById('pkgCount');
  
  async function loadFromLocalJson() {
    try {
      const res = await fetch('../data/packages.json');
      const items = await res.json();
      if (items && items.length > 0) {
        if(cnt) cnt.textContent = `(${items.length})`;
        list.innerHTML = '';
        items.forEach(p => {
          list.appendChild(makeListItem(p));
        });
        return;
      }
    } catch(e) {}
    list.innerHTML = '<div class="no-projects">No packages found. Add a new package →</div>';
  }

  try{
    const snap=await getDocs(collection(db,'packages'));
    if(snap.empty){
      await loadFromLocalJson();
      return;
    }
    if(cnt) cnt.textContent=`(${snap.size})`;
    list.innerHTML='';
    snap.forEach(d=>{
      const p={id:d.id,...d.data()};
      list.appendChild(makeListItem(p));
    });
  }catch(e){
    await loadFromLocalJson();
  }

  if (currentPackages.length === 0) {
    currentPackages = [...DEFAULT_PACKAGES];
    localStorage.setItem('infinite_packages', JSON.stringify(currentPackages));
  }

  currentPackages.sort((a, b) => (Number(a.order) || 99) - (Number(b.order) || 99));
  cnt.textContent = '(' + currentPackages.length + ')';
  renderPackageList();
}

function renderPackageList(){
  const list = document.getElementById('pkgList');
  list.innerHTML = '';
  if (currentPackages.length === 0) {
    list.innerHTML = '<div class="no-projects">No packages found. Click "Reset to Default 6 Packages" below.</div>';
    return;
  }

  currentPackages.forEach(p => {
    const div = document.createElement('div');
    div.className = 'proj-list-item';
    div.style.alignItems = 'flex-start';
    div.style.padding = '14px 16px';

    const featCount = Array.isArray(p.features) ? p.features.length : 0;
    const featSnippet = Array.isArray(p.features) ? p.features.slice(0, 2).join(' • ') : '';

    div.innerHTML = `
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
          <strong style="font-size:15px;color:var(--white);">${sanitise(p.name)}</strong>
          <span class="badge-tag ${p.featured ? 'featured' : ''}">${sanitise(p.tag || 'Standard')}</span>
          ${p.featured ? '<span style="font-size:10px;background:#04AA6D;color:#fff;padding:2px 6px;border-radius:4px;font-weight:700;">FEATURED</span>' : ''}
        </div>
        <div class="pkg-item-price">${sanitise(p.price)}</div>
        <div class="pkg-item-features">${featCount} Features: ${sanitise(featSnippet)}...</div>
        ${p.addon ? '<div style="font-size:11px;color:#04AA6D;margin-top:4px;font-weight:500;">' + sanitise(p.addon) + '</div>' : ''}
      </div>
      <div class="proj-actions" style="margin-left:12px;flex-shrink:0;">
        <button class="btn-edit" data-id="${p.id}">Edit</button>
        <button class="btn-del" data-id="${p.id}">Delete</button>
      </div>
    `;

    div.querySelector('.btn-edit').addEventListener('click', () => editPackage(p));
    div.querySelector('.btn-del').addEventListener('click', () => deletePackage(p.id));
    list.appendChild(div);
  });
}

/* ── Form Submit (Add / Update) ── */
document.getElementById('pkgForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const name = sanitise(document.getElementById('pName').value);
  const price = sanitise(document.getElementById('pPrice').value);
  const tag = sanitise(document.getElementById('pTag').value);
  const desc = sanitise(document.getElementById('pDesc').value);
  const featuresRaw = document.getElementById('pFeatures').value;
  const addon = sanitise(document.getElementById('pAddon').value);
  const cta = sanitise(document.getElementById('pCta').value) || 'Get Started';
  const order = parseInt(document.getElementById('pOrder').value) || 1;
  const featured = document.getElementById('pFeatured').checked;
  const editId = document.getElementById('editId').value;

  if(!name || !price || !featuresRaw.trim()){
    toast('Please fill all required fields.', 'err');
    return;
  }

  const features = featuresRaw.split('\n')
    .map(f => sanitise(f))
    .filter(f => f.length > 0);

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  const pkgData = {
    name, price, tag: tag || 'Package',
    description: desc, features, addon,
    cta, order, featured
  };

  try {
    if(editId){
      // Update
      try {
        await updateDoc(doc(db, 'packages', editId), pkgData);
      } catch(err){
        console.log('Firebase update failed, updating local state', err);
      }
      const idx = currentPackages.findIndex(p => p.id === editId);
      if(idx !== -1){
        currentPackages[idx] = { id: editId, ...pkgData };
      }
      toast('Package updated successfully!', 'ok');
    } else {
      // Add
      let newId = 'pkg-' + Date.now();
      try {
        const docRef = await addDoc(collection(db, 'packages'), pkgData);
        newId = docRef.id;
      } catch(err){
        console.log('Firebase add failed, adding to local state', err);
      }
      currentPackages.push({ id: newId, ...pkgData });
      toast('New package added!', 'ok');
    }

    localStorage.setItem('infinite_packages', JSON.stringify(currentPackages));
    resetForm();
    loadPackages();
  } catch(err) {
    toast('Error: ' + err.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = editId ? 'Update Package' : 'Add Package';
  }
});

function editPackage(p){
  document.getElementById('editId').value = p.id;
  document.getElementById('pName').value = p.name || '';
  document.getElementById('pPrice').value = p.price || '';
  document.getElementById('pTag').value = p.tag || '';
  document.getElementById('pDesc').value = p.description || '';
  document.getElementById('pFeatures').value = Array.isArray(p.features) ? p.features.join('\n') : '';
  document.getElementById('pAddon').value = p.addon || '';
  document.getElementById('pCta').value = p.cta || '';
  document.getElementById('pOrder').value = p.order || 1;
  document.getElementById('pFeatured').checked = Boolean(p.featured);

  document.getElementById('formTitle').textContent = 'Edit Package: ' + p.name;
  document.getElementById('submitBtn').textContent = 'Update Package';
  document.getElementById('cancelEdit').style.display = 'block';
  document.getElementById('pkgForm').scrollIntoView({ behavior: 'smooth' });
}

function resetForm(){
  document.getElementById('pkgForm').reset();
  document.getElementById('editId').value = '';
  document.getElementById('formTitle').textContent = 'Add New Package';
  document.getElementById('submitBtn').textContent = 'Add Package';
  document.getElementById('cancelEdit').style.display = 'none';
  document.getElementById('pFeatured').checked = false;
}
document.getElementById('cancelEdit').addEventListener('click', resetForm);

async function deletePackage(id){
  if(!confirm('Are you sure you want to delete this package?')) return;
  try {
    try {
      await deleteDoc(doc(db, 'packages', id));
    } catch(e){}
    currentPackages = currentPackages.filter(p => p.id !== id);
    localStorage.setItem('infinite_packages', JSON.stringify(currentPackages));
    toast('Package deleted.', 'ok');
    loadPackages();
  } catch(e){
    toast('Delete failed: ' + e.message, 'err');
  }
}

/* ── Reset to Defaults ── */
document.getElementById('resetDefaultsBtn').addEventListener('click', async () => {
  if(!confirm('Reset all packages to the default 6 packages breakdown? Any custom edits will be replaced.')) return;
  try {
    const snap = await getDocs(collection(db, 'packages')).catch(()=>({empty:true}));
    if(!snap.empty){
      for(const d of snap.docs){
        await deleteDoc(doc(db, 'packages', d.id)).catch(()=>{});
      }
    }
    for(const pkg of DEFAULT_PACKAGES){
      await setDoc(doc(db, 'packages', pkg.id), pkg).catch(()=>{});
    }
    currentPackages = [...DEFAULT_PACKAGES];
    localStorage.setItem('infinite_packages', JSON.stringify(currentPackages));
    toast('Default packages restored & synced!', 'ok');
    loadPackages();
  } catch(e){
    currentPackages = [...DEFAULT_PACKAGES];
    localStorage.setItem('infinite_packages', JSON.stringify(currentPackages));
    toast('Local default packages restored!', 'ok');
    loadPackages();
  }
});
</script>
</body>
</html>
