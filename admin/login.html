<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login | Infinite Creative Web Design</title>
<meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' https://www.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.googletagmanager.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https:; frame-src https://challenges.cloudflare.com https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https:;">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<link rel="icon" type="image/webp" href="../images/logo-100w.webp">
<link rel="icon" type="image/png" href="../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0d;--bg2:#111;--card:#141414;
  --blue:#00aaff;--blue-dim:rgba(0,170,255,.12);--blue-glow:rgba(0,170,255,.35);
  --grey:#808080;--grey-l:#a0a0a0;--white:#fff;
  --glass:rgba(255,255,255,.04);--glass-b:rgba(255,255,255,.08);
  --red:#ff4444;--green:#00cc66;
  --ease:cubic-bezier(.23,1,.32,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--white);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,170,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,170,255,.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;}
body::after{content:'';position:fixed;top:-30%;left:-10%;width:70%;height:70%;background:radial-gradient(ellipse,rgba(0,170,255,.07) 0%,transparent 70%);pointer-events:none;}

.wrap{width:100%;max-width:440px;padding:24px;position:relative;z-index:1;}

/* Logo */
.logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:40px;}
.logo img{height:40px;filter:drop-shadow(0 0 14px rgba(0,170,255,.5));mix-blend-mode:screen;}
.logo-text strong{display:block;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;letter-spacing:.18em;}
.logo-text small{font-size:9px;letter-spacing:.32em;color:var(--blue);text-transform:uppercase;}

/* Card */
.card{background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-b);border-radius:24px;padding:36px;}

.card-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin-bottom:4px;}
.card-sub{font-size:13px;color:var(--grey-l);margin-bottom:28px;}

/* Form */
.field{margin-bottom:18px;}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-l);margin-bottom:8px;}
.field input{
  width:100%;background:rgba(255,255,255,.05);border:1px solid var(--glass-b);
  border-radius:12px;padding:13px 16px;font-size:14px;color:var(--white);
  font-family:'Inter',sans-serif;outline:none;transition:all .3s var(--ease);
}
.field input:focus{border-color:rgba(0,170,255,.4);background:rgba(0,170,255,.05);box-shadow:0 0 0 3px rgba(0,170,255,.1);}
.field input.error{border-color:var(--red);}

/* Password toggle */
.pw-wrap{position:relative;}
.pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--grey);padding:4px;transition:color .3s;}
.pw-toggle:hover{color:var(--blue);}

/* Attempts bar */
.attempts-bar{height:3px;background:var(--glass-b);border-radius:2px;margin-bottom:16px;overflow:hidden;}
.attempts-fill{height:100%;border-radius:2px;transition:width .4s var(--ease),background .4s;}

/* Submit */
.btn-login{
  width:100%;background:var(--blue);color:var(--bg);
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;
  padding:14px;border-radius:50px;border:none;cursor:pointer;letter-spacing:.04em;
  transition:all .35s var(--ease);display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-login:hover:not(:disabled){background:#33bbff;box-shadow:0 0 28px var(--blue-glow);transform:translateY(-1px);}
.btn-login:disabled{opacity:.5;cursor:not-allowed;}

/* Divider */
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--glass-b);}
.divider span{font-size:11px;color:var(--grey);letter-spacing:.1em;}

/* 2FA step */
.step{display:none;}
.step.active{display:block;}

/* Error / info messages */
.msg{font-size:13px;padding:12px 14px;border-radius:10px;margin-bottom:16px;display:none;}
.msg.show{display:flex;align-items:center;gap:8px;}
.msg-error{background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.25);color:#ff7070;}
.msg-warn{background:rgba(255,170,0,.1);border:1px solid rgba(255,170,0,.25);color:#ffbb44;}
.msg-info{background:var(--blue-dim);border:1px solid rgba(0,170,255,.2);color:var(--blue);}

/* Lockout */
.lockout{text-align:center;padding:20px 0;}
.lockout-icon{font-size:40px;margin-bottom:12px;}
.lockout-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;margin-bottom:6px;}
.lockout-sub{font-size:13px;color:var(--grey-l);}
#lockTimer{color:var(--blue);font-weight:600;}

/* Footer */
.login-footer{text-align:center;margin-top:20px;font-size:12px;color:var(--grey);}
.login-footer a{color:var(--blue);text-decoration:none;}

/* Spinner */
.spin{display:inline-block;width:16px;height:16px;border:2px solid transparent;border-top-color:var(--bg);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Security badge */
.sec-badge{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--grey);margin-top:16px;justify-content:center;}
.sec-badge svg{color:var(--blue);}
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">
    <img src="../images/logo-100w.webp" srcset="../images/logo-100w.webp 100w, ../images/logo-200w.webp 200w" sizes="50px" alt="Infinite Design" width="50" height="50" loading="lazy" decoding="async">
    <div class="logo-text">
      <strong>INFINITE</strong>
      <small>Creative Web Design</small>
    </div>
  </div>

  <!-- Step 1: Email + Password -->
  <div class="card">
    <div id="stepLogin" class="step active">
      <h1 class="card-title">Admin Portal</h1>
      <p class="card-sub">Secure access to the dashboard</p>

      <div class="msg msg-error" id="errMsg">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r=".5" fill="currentColor"/></svg>
        <span id="errText"></span>
      </div>
      <div class="msg msg-warn" id="warnMsg">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><circle cx="12" cy="17" r=".5" fill="currentColor"/></svg>
        <span id="warnText"></span>
      </div>

      <!-- Lockout view -->
      <div class="lockout" id="lockoutView" style="display:none">
        <div class="lockout-icon">🔒</div>
        <div class="lockout-title">Account Temporarily Locked</div>
        <div class="lockout-sub">Too many failed attempts. Try again in <span id="lockTimer">30:00</span></div>
      </div>

      <!-- Login form -->
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="emailInput">Email Address</label>
          <input type="email" id="emailInput" placeholder="admin@infinitedesign.lk" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="pwInput">Password</label>
          <div class="pw-wrap">
            <input type="password" id="pwInput" placeholder="••••••••••" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="attempts-bar"><div class="attempts-fill" id="attemptsFill" style="width:0%"></div></div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span id="loginBtnText">Sign In</span>
        </button>
      </form>
    </div>

  </div>

  <div class="sec-badge">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    256-bit encrypted (TLS) • Server-side throttling via Firebase Auth
  </div>
  <div class="login-footer"><a href="../index.html">← Back to site</a></div>
</div>

<script type="module" src="../js/admin-login.js"></script>
</body>
</html>
