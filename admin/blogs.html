<main class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <h1 class="page-title">Blog Manager</h1>
      <div class="page-sub">Add, edit and delete blog articles</div>
    </div>
  </header>

  <div class="proj-manager">
    <!-- List -->
    <div class="proj-list-card">
      <div class="form-title">All Blogs <span id="projCount" style="font-size:12px;color:var(--grey);font-weight:400"></span></div>
      <div id="projList"><div class="no-projects">Loading projects…</div></div>
    </div>

    <!-- Form -->
    <div class="proj-form-card">
      <div class="form-title" id="formTitle">Add New Blog</div>
      <input type="hidden" id="editId">
      <form id="projForm" novalidate>
        <div class="form-field">
          <label class="form-label" for="pLang">Language / භාෂාව</label>
          <select id="pLang" class="form-select form-input">
            <option value="si" selected>සිංහල (Sinhala)</option>
            <option value="en">English</option>
            <option value="ta">தமிழ் (Tamil)</option>
          </select>
        </div>
        <div class="form-field">
          <label class="form-label" for="pTitle">English Reference Title *</label>
          <input type="text" id="pTitle" class="form-input" placeholder="e.g. Modern Web Design in Sri Lanka" maxlength="150" required>
        </div>
        <div class="form-field">
          <label class="form-label" for="pTitleSi" style="color:#04AA6D; font-weight:700;">සිංහල මාතෘකාව (Sinhala Title)</label>
          <input type="text" id="pTitleSi" class="form-input" placeholder="උදා: ශ්‍රී ලංකාවේ ව්‍යාපාර සඳහා ඉහළ ප්‍රතිඵල ලබාදෙන වෙබ් අඩවි නිර්මාණය..." style="border-color:rgba(4,170,109,0.4);" maxlength="200">
        </div>
        <div class="form-field">
          <label class="form-label" for="pCategory">Category *</label>
          <select id="pCategory" class="form-select form-input" required>
            <option value="">Select category…</option>
            <option>Branding</option>
            <option>Web Design</option>
            <option>UI / UX</option>
            <option>Graphic Design</option>
            <option>Logistics Branding</option>
            <option>Motion Graphics</option>
            <option>Business & Web Design</option>
            <option>Web Performance & SEO</option>
            <option>E-Commerce & Fintech</option>
            <option>AI & Modern Tech</option>
          </select>
        </div>
        <div class="form-field">
          <label class="form-label" for="pStatus">Publication Status</label>
          <select id="pStatus" class="form-select form-input">
            <option value="published">Published (Live on Website)</option>
            <option value="draft">Draft (Review Required)</option>
          </select>
        </div>
        <div class="form-field">
          <label class="form-label" for="pTags" style="color:#38bdf8; font-weight:600;">Add tags</label>
          <input type="text" id="pTags" class="form-input" placeholder="Enter tags separated by comma or semicolon" style="border-radius:10px; border:1px solid rgba(56,189,248,0.4); padding:10px 14px;">
        </div>
        <div class="form-field">
          <label class="form-label" for="pDesc">English Description / Excerpt</label>
          <textarea id="pDesc" class="form-textarea form-input" placeholder="Describe the article in English…" maxlength="500"></textarea>
        </div>
        <div class="form-field">
          <label class="form-label" for="pDescSi" style="color:#04AA6D; font-weight:700;">සිංහල කෙටි විස්තරය (Sinhala Excerpt)</label>
          <textarea id="pDescSi" class="form-textarea form-input" placeholder="ලිපියේ ප්‍රධාන කරුණු හා සාරාංශය සිංහලෙන්…" style="border-color:rgba(4,170,109,0.4);" maxlength="1000"></textarea>
        </div>
        <div class="form-field" style="display:flex; align-items:center; gap:10px; margin-top:8px; margin-bottom:14px; background:rgba(4,170,109,0.08); padding:10px 14px; border-radius:10px; border:1px solid rgba(4,170,109,0.25);">
          <input type="checkbox" id="pPermanent" checked style="width:18px; height:18px; cursor:pointer; accent-color:#04AA6D;">
          <label for="pPermanent" style="margin:0; font-size:12px; color:#fff; cursor:pointer; font-weight:600;">
            🛡️ Auto-Delete Protection (Never delete or overwrite / කිසි විටෙකත් ඉවත් නොකරන්න)
          </label>
        </div>
        <div class="form-field">
          <label class="form-label">Blog Image</label>
          <div class="upload-area" id="uploadArea">
            <input type="file" id="imgFile" accept="image/jpeg,image/png,image/webp,image/gif" aria-label="Upload Blog Image">
            <svg class="upload-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <div class="upload-text">Click to upload or drag & drop<br><small>JPG, PNG, WebP · Max 5MB</small></div>
            <img class="upload-preview" id="imgPreview" alt="Preview" width="300" height="200" loading="lazy" decoding="async">
            <div class="file-error" id="fileError"></div>
          </div>
        </div>
        <div style="display:flex;gap:10px">
          <button type="submit" class="btn-form" id="submitBtn">Add Blog</button>
          <button type="button" class="btn-form" id="cancelEdit" style="display:none;background:var(--glass);color:var(--white);border:1px solid var(--glass-b)">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</main>

<div class="toast" id="toast"><div class="toast-dot"></div><span id="toastMsg"></span></div>
