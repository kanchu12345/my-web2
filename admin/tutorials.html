<style>
  .badge-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: rgba(4,170,109,0.15);
    color: #04AA6D;
  }
  .track-selector-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  .track-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-b);
    color: var(--grey-l);
    padding: 8px 16px;
    border-radius: 50px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .track-btn:hover {
    background: rgba(4,170,109,0.1);
    color: #fff;
    border-color: #04AA6D;
  }
  .track-btn.active {
    background: #04AA6D;
    color: #fff;
    border-color: #04AA6D;
  }
  .lesson-card-item {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--glass-b);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.2s;
  }
  .lesson-card-item:hover {
    background: rgba(255,255,255,0.04);
    border-color: rgba(4,170,109,0.4);
  }
  .lesson-info-title { font-weight: 700; font-size: 15px; color: #fff; margin-bottom: 4px; }
  .lesson-info-sub { font-size: 12px; color: var(--grey); }
  .action-btn-group { display: flex; gap: 8px; }
  .btn-edit { background: rgba(0,170,255,0.15); color: #00aaff; border:none; padding:6px 12px; border-radius:6px; font-weight:600; font-size:12px; cursor:pointer; }
  .btn-delete { background: rgba(255,68,68,0.15); color: #ff4444; border:none; padding:6px 12px; border-radius:6px; font-weight:600; font-size:12px; cursor:pointer; }
  .code-input-area { font-family: monospace; font-size: 13px; background: #0b0f19; color: #34d399; }
</style>
</head>
<body>

  <!-- ── MAIN CONTENT ───────────────────────────── -->
  <main class="main-content">
    <header class="topbar">
      <div>
        <h1 class="page-title">Infinite Academy Tutorials Manager</h1>
        <div class="page-sub">Add, edit, or upload new programming courses and lessons</div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn btn-secondary" onclick="fetchW3SchoolsAuto()" style="background:rgba(4,170,109,0.15); color:#04AA6D; border:1px solid #04AA6D; font-weight:700;">⚡ AI Auto-Fetch W3Schools Tutorials</button>
        <button class="btn btn-primary" onclick="openNewLessonModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          + Add New Lesson
        </button>
      </div>
    </header>

    <!-- Track Selector Tabs -->
    <div class="track-selector-bar" id="trackSelectBar">
      <button class="track-btn active" onclick="switchAdminTrack('html')">🌐 HTML5</button>
      <button class="track-btn" onclick="switchAdminTrack('css')">🎨 CSS3</button>
      <button class="track-btn" onclick="switchAdminTrack('js')">⚡ JavaScript</button>
      <button class="track-btn" onclick="switchAdminTrack('python')">🐍 Python</button>
      <button class="track-btn" onclick="switchAdminTrack('sql')">🗄️ SQL</button>
      <button class="track-btn" onclick="switchAdminTrack('php')">🐘 PHP</button>
      <button class="track-btn" onclick="switchAdminTrack('react')">⚛️ React</button>
      <button class="track-btn" onclick="switchAdminTrack('git')">🌿 Git</button>
    </div>

    <!-- Lessons List Card -->
    <div class="card" style="padding:24px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
        <div>
          <h2 style="font-size:18px; color:#fff; margin:0;" id="currentTrackTitle">HTML5 Lessons</h2>
          <div style="font-size:12px; color:var(--grey); margin-top:4px;" id="currentTrackDesc">Managing structured lessons</div>
        </div>
        <button class="btn btn-secondary" onclick="exportTutorialsJSON()">📥 Export JSON Database</button>
      </div>

      <div id="lessonsListContainer">
        <!-- Rendered list of lessons -->
      </div>
    </div>
  </main>

<!-- ── LESSON MODAL (ADD / EDIT) ──────────────── -->
<div class="modal" id="lessonModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:9999; align-items:center; justify-content:center;">
  <div class="card" style="width:90vw; max-width:800px; max-height:90vh; overflow-y:auto; padding:28px; background:#131b2e; border:1px solid var(--glass-b);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2 id="modalTitle" style="color:#fff; font-size:1.4rem; margin:0;">Add New Lesson</h2>
      <button onclick="closeLessonModal()" style="background:none; border:none; color:#fff; font-size:22px; cursor:pointer;">&#10005;</button>
    </div>

    <form id="lessonForm" onsubmit="saveLesson(event)">
      <input type="hidden" id="editLessonId">
      
      <div class="form-group">
        <label>Track / Language *</label>
        <select class="form-control" id="formTrackKey" required>
          <option value="html">HTML5</option>
          <option value="css">CSS3</option>
          <option value="js">JavaScript</option>
          <option value="python">Python</option>
          <option value="sql">SQL</option>
          <option value="php">PHP</option>
          <option value="react">React</option>
          <option value="git">Git</option>
        </select>
      </div>

      <div class="form-group">
        <label>Lesson Title *</label>
        <input type="text" class="form-control" id="formLessonTitle" required placeholder="e.g. CSS Flexbox Fundamentals">
      </div>

      <div class="form-group">
        <label>Lesson Subtitle / Summary *</label>
        <input type="text" class="form-control" id="formLessonSummary" required placeholder="e.g. Master horizontal and vertical alignment with flexbox.">
      </div>

            <div class="form-group">
        <label style="color:#38bdf8; font-weight:600;">Add tags</label>
        <input type="text" class="form-control" id="formLessonTags" placeholder="Enter tags separated by comma or semicolon" style="border-radius:10px; border:1px solid rgba(56,189,248,0.4); padding:10px 14px;">
      </div>
      <div class="form-group">
        <label>Estimated Read Time</label>
        <input type="text" class="form-control" id="formLessonReadTime" value="5 min read" placeholder="e.g. 5 min read">
      </div>

      <div class="form-group">
        <label>Lesson Content & Explanations (HTML Supported) *</label>
        <textarea class="form-control" id="formLessonContent" rows="6" required placeholder="<p class='lead'>Flexbox is a 1-dimensional layout model...</p>"></textarea>
      </div>

      <div class="form-group">
        <label>Interactive Code Example (Runs in Live Playground) *</label>
        <textarea class="form-control code-input-area" id="formLessonCode" rows="8" required placeholder="<!DOCTYPE html>&#10;<html>..."></textarea>
      </div>

      <div class="form-group">
        <label>Key Takeaways (One per line)</label>
        <textarea class="form-control" id="formLessonTakeaways" rows="3" placeholder="justify-content aligns along main axis&#10;align-items aligns along cross axis"></textarea>
      </div>

      <hr style="border-color:var(--glass-b); margin:20px 0;">
      <h3 style="color:#04AA6D; font-size:1.1rem; margin-bottom:12px;">Interactive Quiz Challenge</h3>

      <div class="form-group">
        <label>Quiz Question</label>
        <input type="text" class="form-control" id="formQuizQuestion" placeholder="e.g. Which property sets horizontal alignment in Flexbox?">
      </div>

      <div class="form-group">
        <label>Quiz Options (4 options, comma separated)</label>
        <input type="text" class="form-control" id="formQuizOptions" placeholder="align-items, justify-content, flex-wrap, display">
      </div>

      <div class="form-group">
        <label>Correct Option Index (0 for 1st option, 1 for 2nd, 2 for 3rd, 3 for 4th)</label>
        <input type="number" class="form-control" id="formQuizAnswer" min="0" max="3" value="1">
      </div>

      <div class="form-group">
        <label>Explanation Tip</label>
        <input type="text" class="form-control" id="formQuizExplanation" placeholder="justify-content distributes space along the main axis.">
      </div>

      <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
        <button type="button" class="btn btn-secondary" onclick="closeLessonModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Lesson</button>
      </div>
    </form>
  </div>
</div>

<script src="../data/w3-tutorials.js?v=2026"></script>
<script>
  let currentAdminTrack = 'html';
  let coursesData = window.ACADEMY_COURSES || window.W3_TUTORIALS || {};

  document.addEventListener('DOMContentLoaded', () => {
    renderAdminLessonsList();
  });

  function switchAdminTrack(trackKey) {
    currentAdminTrack = trackKey;
    document.querySelectorAll('.track-btn').forEach(b => {
      b.classList.toggle('active', b.getAttribute('onclick').includes(trackKey));
    });
    renderAdminLessonsList();
  }

  function renderAdminLessonsList() {
    const course = coursesData[currentAdminTrack];
    if (!course) return;

    document.getElementById('currentTrackTitle').textContent = course.name + ' Lessons';
    document.getElementById('currentTrackDesc').textContent = course.tagline || 'Manage course lessons and code playgrounds';

    const container = document.getElementById('lessonsListContainer');
    let html = '';

    if (!course.sections || course.sections.length === 0 || !course.sections[0].lessons || course.sections[0].lessons.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--grey);">No lessons found for this track. Click "+ Add New Lesson" to create one.</div>';
      return;
    }

    course.sections.forEach((sec, sIdx) => {
      sec.lessons.forEach((l, lIdx) => {
        html += `
          <div class="lesson-card-item">
            <div>
              <div class="lesson-info-title">${l.title}</div>
              <div class="lesson-info-sub">${l.summary || ''} • <span style="color:#04AA6D;">${l.readTime || '5 min'}</span></div>
            </div>
            <div class="action-btn-group">
              <button class="btn-edit" onclick="editLesson('${l.id}')">✏️ Edit</button>
              <button class="btn-delete" onclick="deleteLesson('${l.id}')">🗑️ Delete</button>
            </div>
          </div>
        `;
      });
    });

    container.innerHTML = html;
  }

  function fetchW3SchoolsAuto() {
    alert('⚡ AI W3Schools Auto-Fetch Bot is active! W3Schools tutorials are auto-scraped into the database. Click "View Live Tutorials" to see updated courses.');
  }

  function openNewLessonModal() {
    document.getElementById('modalTitle').textContent = 'Add New Lesson';
    document.getElementById('editLessonId').value = '';
    document.getElementById('lessonForm').reset();
    document.getElementById('formTrackKey').value = currentAdminTrack;
    document.getElementById('lessonModal').style.display = 'flex';
  }

  function editLesson(id) {
    const course = coursesData[currentAdminTrack];
    let found = null;
    if (course && course.sections) {
      course.sections.forEach(sec => {
        sec.lessons.forEach(l => {
          if (l.id === id) found = l;
        });
      });
    }
    if (!found) return;

    document.getElementById('modalTitle').textContent = 'Edit Lesson';
    document.getElementById('editLessonId').value = found.id;
    document.getElementById('formTrackKey').value = currentAdminTrack;
    document.getElementById('formLessonTitle').value = found.title || '';
    document.getElementById('formLessonSummary').value = found.summary || '';
    document.getElementById('formLessonReadTime').value = found.readTime || '5 min read';
    document.getElementById('formLessonContent').value = found.content || '';
    document.getElementById('formLessonCode').value = found.code || '';
    document.getElementById('formLessonTakeaways').value = (found.keyTakeaways || []).join('\n');

    if (found.challenge) {
      document.getElementById('formQuizQuestion').value = found.challenge.question || '';
      document.getElementById('formQuizOptions').value = (found.challenge.options || []).join(', ');
      document.getElementById('formQuizAnswer').value = found.challenge.answer || 0;
      document.getElementById('formQuizExplanation').value = found.challenge.explanation || '';
    } else {
      document.getElementById('formQuizQuestion').value = '';
      document.getElementById('formQuizOptions').value = '';
      document.getElementById('formQuizAnswer').value = 0;
      document.getElementById('formQuizExplanation').value = '';
    }

    document.getElementById('lessonModal').style.display = 'flex';
  }

  function closeLessonModal() {
    document.getElementById('lessonModal').style.display = 'none';
  }

  function saveLesson(e) {
    e.preventDefault();
    const trackKey = document.getElementById('formTrackKey').value;
    const lessonId = document.getElementById('editLessonId').value || ('lesson_' + Date.now());
    const title = document.getElementById('formLessonTitle').value;
    const summary = document.getElementById('formLessonSummary').value;
    const readTime = document.getElementById('formLessonReadTime').value;
    const content = document.getElementById('formLessonContent').value;
    const code = document.getElementById('formLessonCode').value;
    const takeaways = document.getElementById('formLessonTakeaways').value.split('\n').filter(Boolean);

    const quizQ = document.getElementById('formQuizQuestion').value;
    const quizOpts = document.getElementById('formQuizOptions').value.split(',').map(s => s.trim()).filter(Boolean);
    const quizAns = parseInt(document.getElementById('formQuizAnswer').value, 10) || 0;
    const quizExp = document.getElementById('formQuizExplanation').value;

    const newLessonObj = {
      id: lessonId,
      title: title,
      summary: summary,
      readTime: readTime,
      content: content,
      code: code,
      keyTakeaways: takeaways
    };

    if (quizQ && quizOpts.length > 0) {
      newLessonObj.challenge = {
        question: quizQ,
        options: quizOpts,
        answer: quizAns,
        explanation: quizExp
      };
    }

    const course = coursesData[trackKey];
    if (course) {
      if (!course.sections || course.sections.length === 0) {
        course.sections = [{ title: course.name + ' Tutorial', lessons: [] }];
      }
      const existingIdx = course.sections[0].lessons.findIndex(l => l.id === lessonId);
      if (existingIdx !== -1) {
        course.sections[0].lessons[existingIdx] = newLessonObj;
      } else {
        course.sections[0].lessons.push(newLessonObj);
      }
    }

    closeLessonModal();
    renderAdminLessonsList();
    alert('Lesson saved successfully! Click "Export JSON Database" to download or sync.');
  }

  function deleteLesson(id) {
    if (!confirm('Are you sure you want to delete this lesson?')) return;
    const course = coursesData[currentAdminTrack];
    if (course && course.sections) {
      course.sections.forEach(sec => {
        sec.lessons = sec.lessons.filter(l => l.id !== id);
      });
    }
    renderAdminLessonsList();
  }

  function exportTutorialsJSON() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(coursesData, null, 2));
    const dlAnchor = document.createElement('a');
    dlAnchor.setAttribute("href", dataStr);
    dlAnchor.setAttribute("download", "w3-tutorials.json");
    dlAnchor.click();
  }
</script>

</body>
