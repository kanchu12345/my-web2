<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Viewer | Infinite Academy</title>
  <link rel="stylesheet" href="../css/main.css?v=10">
  <link rel="icon" type="image/png" href="../images/logo.png">
  <style>
    body { background: #fdfdfd; color: #333; }
    .course-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 40px;
      margin-top: 100px;
      padding-bottom: 80px;
    }
    @media (max-width: 900px) {
      .course-layout { grid-template-columns: 1fr; }
    }
    .course-sidebar {
      background: #fff;
      border-right: 1px solid #e0e0e0;
      padding-right: 24px;
    }
    .sidebar-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #1a1a1a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .chapter-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .chapter-item { margin-bottom: 8px; }
    .chapter-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 8px;
      color: #555;
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }
    .chapter-link:hover {
      background: #f0f0f0;
      color: #1a1a1a;
    }
    .chapter-link.active {
      background: rgba(4, 170, 109, 0.1);
      color: #04AA6D;
      font-weight: 600;
    }
    .course-content { max-width: 800px; }
    .lesson-header {
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid #e0e0e0;
    }
    .lesson-title {
      font-size: 2.5rem;
      font-weight: 800;
      color: #1a1a1a;
      margin-bottom: 16px;
    }
    .lesson-meta {
      display: flex;
      gap: 16px;
      color: #777;
      font-size: 0.9rem;
    }
    .lesson-body h2 {
      font-size: 1.8rem;
      color: #1a1a1a;
      margin: 40px 0 16px;
    }
    .lesson-body p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #444;
      margin-bottom: 20px;
    }
    .code-block {
      background: #282A35;
      border-radius: 12px;
      padding: 20px;
      margin: 24px 0;
      overflow-x: auto;
    }
    .code-block code {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      color: #f8f8f2;
    }
    .code-tag { color: #ff79c6; }
    .code-attr { color: #50fa7b; }
    .code-val { color: #f1fa8c; }
    
    .callout {
      background: #e8f5e9;
      border-left: 4px solid #04AA6D;
      padding: 20px;
      border-radius: 0 8px 8px 0;
      margin: 24px 0;
    }
    .callout-title {
      font-weight: 700;
      color: #04AA6D;
      margin-bottom: 8px;
    }
    .nav { background: #282A35; } 
    
    .nav-buttons {
      margin-top: 60px;
      display: flex;
      justify-content: space-between;
    }
    .btn-nav {
      background: #04AA6D;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .btn-nav:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .btn-nav-prev {
      background: transparent;
      color: #888;
    }
    .btn-nav-prev:hover:not(:disabled) {
      color: #333;
    }
  </style>
</head>
<body>
  <!-- NAVIGATION -->
  <nav class="nav" id="mainNav" role="navigation">
    <a href="../index.html" class="nav-logo">
      <img src="../images/logo.png" alt="Infinite Design Logo" width="48" height="48">
      <div class="nav-brand">
        <strong>INFINITE</strong>
        <small>Creative Web Design</small>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="projects">Projects</a></li>
      <li><a href="about">About</a></li>
      <li><a href="services">Services</a></li>
      <li><a href="blogs">Blogs</a></li>
      <li><a href="tutorials" class="active" style="color:#04AA6D;">Tutorials</a></li>
      <li><a href="contact">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <a href="https://wa.me/94789714912" class="nav-cta" target="_blank">Let's Talk</a>
    </div>
  </nav>

  <div class="section-inner course-layout" id="app" style="display: none;">
    <!-- SIDEBAR -->
    <aside class="course-sidebar">
      <h3 class="sidebar-title" id="courseTitle">Loading...</h3>
      <ul class="chapter-list" id="chapterList">
        <!-- Injected via JS -->
      </ul>
      <div style="margin-top: 40px;">
        <a href="tutorials" style="color: #04AA6D; text-decoration: none; font-weight: 600;">← Back to Courses</a>
      </div>
    </aside>

    <!-- CONTENT -->
    <main class="course-content">
      <header class="lesson-header">
        <h1 class="lesson-title" id="lessonTitle">Loading...</h1>
        <div class="lesson-meta" id="lessonMeta">
          <span>Module X of Y</span>
          <span>•</span>
          <span>X min read</span>
        </div>
      </header>
      
      <div class="lesson-body" id="lessonBody">
        <!-- Content injected via JS -->
      </div>
      
      <div class="nav-buttons">
        <button class="btn-nav btn-nav-prev" id="btnPrev">&larr; Previous</button>
        <button class="btn-nav" id="btnNext">Next Chapter &rarr;</button>
      </div>
    </main>
  </div>
  
  <div id="loader" style="text-align: center; margin-top: 150px; font-size: 1.2rem; color: #888;">
    Loading course data...
  </div>

  <script src="../js/main.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const courseId = urlParams.get('course');
      
      if (!courseId) {
        document.getElementById('loader').innerHTML = 'No course specified. <a href="tutorials">Go back</a>';
        return;
      }

      let courseData = null;
      let currentChapterIndex = 0;

      try {
        const res = await fetch(`data/${courseId}-course.json?v=${new Date().getTime()}`);
        if (!res.ok) throw new Error('Course not found');
        courseData = await res.json();
        
        document.getElementById('loader').style.display = 'none';
        document.getElementById('app').style.display = 'grid';
        
        document.title = courseData.title + ' | Infinite Academy';
        document.getElementById('courseTitle').textContent = courseData.title;
        
        renderSidebar();
        loadChapter(0);
        
      } catch (err) {
        document.getElementById('loader').innerHTML = 'Error loading course data. <a href="tutorials">Go back</a>';
        console.error(err);
      }

      function renderSidebar() {
        const list = document.getElementById('chapterList');
        list.innerHTML = '';
        courseData.chapters.forEach((chapter, index) => {
          const li = document.createElement('li');
          li.className = 'chapter-item';
          const btn = document.createElement('button');
          btn.className = 'chapter-link';
          btn.textContent = chapter.title;
          btn.onclick = () => loadChapter(index);
          li.appendChild(btn);
          list.appendChild(li);
        });
      }

      function loadChapter(index) {
        if (index < 0 || index >= courseData.chapters.length) return;
        currentChapterIndex = index;
        
        const chapter = courseData.chapters[index];
        document.getElementById('lessonTitle').textContent = chapter.title;
        document.getElementById('lessonMeta').innerHTML = `
          <span>Module ${index + 1} of ${courseData.chapters.length}</span>
          <span>•</span>
          <span>${chapter.readTime || '10 min read'}</span>
        `;
        document.getElementById('lessonBody').innerHTML = chapter.content;
        
        // Update sidebar active state
        const links = document.querySelectorAll('.chapter-link');
        links.forEach((l, idx) => {
          if (idx === index) l.classList.add('active');
          else l.classList.remove('active');
        });
        
        // Update nav buttons
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        
        btnPrev.disabled = (index === 0);
        btnNext.textContent = (index === courseData.chapters.length - 1) ? 'Finish Course' : 'Next Chapter →';
        
        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      document.getElementById('btnPrev').addEventListener('click', () => {
        loadChapter(currentChapterIndex - 1);
      });

      document.getElementById('btnNext').addEventListener('click', () => {
        if (currentChapterIndex < courseData.chapters.length - 1) {
          loadChapter(currentChapterIndex + 1);
        } else {
          window.location.href = 'tutorials.html';
        }
      });
    });
  </script>
</body>
</html>
